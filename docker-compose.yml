version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartnotes-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: securepassword
      MYSQL_DATABASE: smartnotes
    ports:
      - "3316:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: